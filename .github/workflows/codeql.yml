# Shared CodeQL scan (decisions 118 and 119): GitHub's code scanning for every dazzer-io
# repository, as one workflow here that each repository calls, in place of a copy of its own.
# A repository calls it from a short caller file (README.md, "The shared CodeQL scan"), naming its
# languages; this file decides everything else, so a new repository needs no copy and no review of
# one, and a change in a calling repository cannot edit the scan it is scanned by.
#
# WHAT IT SCANS. What GitHub's automatic setup scanned on dazzer and dazzer-app, read from its own
# runs on 5 Nov 2026: each language the caller names, of actions, javascript-typescript and python
# alone, with build-mode none (CodeQL reads the source and builds nothing, so no code of the change
# runs), the security-extended query suite (what the setup calls "extended"), under the category
# /language:<language>, the one its analyses were stored under. The analysis is now keyed by this
# workflow, not the automatic setup, so whether each alert carries on by its rule and fingerprint,
# rather than closing and opening again, is read on a calling repository's first run on main, not
# promised here.
#
# ONLY THREE LANGUAGES. The analysis's first step refuses any language but actions,
# javascript-typescript and python, the three dazzer and dazzer-app scan today (decision 133).
# GitHub's page on compiled languages does not say whether build mode none for C# or Java reads
# the change's build files (restoring dependencies through dotnet, Maven or Gradle), which would run
# what the change wrote on the scan machines; and Go, Swift and Kotlin cannot be scanned without a
# build at all. So a later language joins by its own decision, never by a caller naming it.
#
# DAZZER-IO IS A TRUSTED PUBLISHER. CodeQL's actions/unpinned-tag query warns on every action or
# reusable workflow used at a branch or tag rather than a commit, unless its owner is on the list
# of trusted publishers the query reads (trustedActionsOwnerDataModel, which CodeQL fills with
# actions, github and advanced-security). Calling the organisation's own shared workflows at main
# is the design (decisions 118 and 119), so every caller carried a warning on its own call of this
# scan, and a required results check failing on warnings refused the change. Ben chose to trust
# dazzer-io's own (decision 165), so this scan adds dazzer-io to that list. It names dazzer-io and
# no other owner: an action or workflow of any other owner, used without a commit, still warns.
# It touches the analysis of actions alone; every other language and every other query is as before.
#   - How. The analysis's second step, run for actions only, writes a model pack,
#     shared-scan/trusted-publishers, whose one row adds dazzer-io to that list, into CodeQL's own
#     package cache under the runner's home folder (~/.codeql/packages/<scope>/<name>/<version>),
#     where CodeQL finds a pack named without a registry. Its scope, shared-scan, is a CodeQL pack
#     scope and not the organisation's name, since the pack is no GitHub project and no line here
#     names a project by hand (decision 167). The analyze step names it to the queries
#     through CODEQL_ACTION_EXTRA_OPTIONS, an option GitHub documents on that step, as
#     --model-packs of database run-queries; for any other language the option is empty, which the
#     action reads as no options. It passes no --additional-packs, since the action passes its own
#     for a pull request's diff-informed analysis and CodeQL's manual says a later one overrides it.
#   - Written as two files of fixed text, not by CodeQL's own pack commands: the step then runs
#     before the checkout, so it reads nothing the change wrote, and it runs no tool but the shell,
#     holds no token and takes no input. CodeQL 2.27.4, the version this pin of the action runs,
#     reads the pack from that folder, and a pack it cannot find stops the analysis, so a pack
#     written wrongly turns the run red rather than passing unseen.
#   - Nothing is published (decision 166). GitHub's own route for an organisation's packs is its
#     package registry, but a public package cannot be made private again, and a private one needs
#     a grant for each repository's workflows, which a new repository would wait on.
#
# WHY IT IS SPLIT IN TWO.
#   - analyze runs on the scan machines, by ${{ vars.SCAN_RUNNER_2 || 'ubuntu-latest' }}, so an
#     empty setting keeps it on GitHub's computers (decision 93). A called workflow reads its
#     caller's variables (docs.github.com, Variables reference: "For reusable workflows, the
#     variables from the caller workflow's repository are used."), so the setting resolves as the
#     calling repository sees it, and a repository the setting is not visible to scans on GitHub's.
#     That setting is the organisation's unless the calling repository sets a variable of the same
#     name: GitHub reads a repository variable SCAN_RUNNER_2 ahead of the organisation's, so that
#     repository's admin can point its scan at any label. What keeps a repository from moving its
#     scan onto machines that run changes' own code is the runner groups' repository lists, and
#     nothing in this file: a label reaches only a set whose group admits the repository, so the
#     scan stays apart only while no group admitting a gated repository offers it a change-check
#     set's label.
#     It holds a read-only token: contents: read to check out, actions: read so CodeQL can read
#     this run's workflow on a private repository. Read-only is not nothing: the checkout and
#     CodeQL's actions take that token, and the runner hands every job its own runtime token, which
#     can write this run's artifacts and caches. It uploads nothing (upload: never) and keeps its
#     post-processed results (each alert's fingerprint read from its own checkout) as an artifact
#     of this run.
#   - upload, on GitHub's own ubuntu-latest written as a literal label, is the only job holding
#     security-events: write, since a write token on a machine of ours would sit within reach of
#     whatever ran there before it (decision 36). It checks nothing out and runs no script: one run
#     per language fetches that language's results by name, failing if they are missing, and hands
#     them to code scanning under the same category. It runs only when every language's analysis
#     succeeded, so a partial scan never passes (decision 101, kept for every caller by decision
#     131): a failed analysis uploads nothing and the run is red; a cancelled one uploads nothing
#     and the run ends cancelled, not red. An upload that fails after every analysis passed may
#     leave other languages' results already sent; that run is red.
#   - complete, named "CodeQL complete", is the one check a caller requires (decision 135). It
#     runs always, after both jobs, on GitHub's own ubuntu-latest with no token at all
#     (permissions: {}), and fails unless the analysis and the upload both succeeded; its name is
#     the same whatever languages a caller names. The Analyze and upload checks cannot be required
#     in its place: a skipped upload reads as success to a required-check rule, and a pull request
#     that adds a language to its own caller fails that leg's guard, skips every upload, and leaves
#     the Analyze checks of the languages already named green. It costs one GitHub minute a run.
#
# WHAT THE CALLER GRANTS. A called workflow's token is at most what its calling job grants, so the
# calling job grants contents: read, actions: read and security-events: write, and nothing more.
# The scan declares no secret and reads none, so a caller passes none (no secrets:, no inherit).
# Concurrency is the caller's, since only it knows its triggers.
#
# WHO DEFINES THE SCAN. Called at @main, this file is read from this repository's main branch,
# never from the change being scanned; and the scan runner group is to admit only the shared
# workflows at refs/heads/main (decision 119, the runners task r-1.54), which this file cannot
# see. A change to this repository's own copy is a pull request here, reviewed here; a pull
# request elsewhere runs this file as main holds it. No workflow of this repository but the two
# scans may call it (test/runs-on.test.mjs).
#
# test/codeql-shared.test.mjs pins what is scanned and what each job holds, line for line where it
# matters; test/runs-on.test.mjs holds its jobs to the machine rules every workflow here keeps (a
# job reading SCAN_RUNNER_2 holds no write and no secret; a write-token job names a literal GitHub
# label) and reads it only in the plain subset of YAML its header lists.
name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          The languages to scan, as a JSON list in a string,
          for example ["actions", "javascript-typescript"]
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ vars.SCAN_RUNNER_2 || 'ubuntu-latest' }}
    # The slowest analysis on record was dazzer's javascript-typescript on main, 1165 s on GitHub's
    # 2-core ubuntu-latest (its automatic setup's last 20 runs, 5 Nov 2026); the limit is about twice
    # that, since the scan machines fetch the CodeQL bundle GitHub's image already holds.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      # Only the languages whose build mode none is known to run no build tool, the three dazzer and
      # dazzer-app scan today (decision 133); a later language joins by its own decision. It runs
      # before the checkout, reads only the language this run was handed, and builds nothing.
      - name: Refuse a language this scan does not take
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          case "$LANGUAGE" in
            actions | javascript-typescript | python) ;;
            *)
              echo "::error::This scan takes only actions, javascript-typescript and python (decision 133)."
              exit 1
              ;;
          esac

      # Actions only: dazzer-io joins CodeQL's trusted publishers (decision 165, DAZZER-IO IS A
      # TRUSTED PUBLISHER above). It runs before the checkout, so it reads nothing the change wrote,
      # and holds no token. It first removes the pack's folder, so a file left there by an earlier
      # run on the same machine is never read as part of it. Every line of its script sits at one
      # indent, so each file it writes is exactly the lines between its two markers.
      - name: Add dazzer-io to CodeQL's trusted publishers
        if: ${{ matrix.language == 'actions' }}
        run: |
          pack="$HOME/.codeql/packages/shared-scan/trusted-publishers/1.0.0"
          rm -rf "$pack"
          mkdir -p "$pack/models"
          cat > "$pack/codeql-pack.yml" <<'PACK'
          name: shared-scan/trusted-publishers
          version: 1.0.0
          library: true
          extensionTargets: {codeql/actions-all: '*'}
          dataExtensions: [models/*.json]
          PACK
          cat > "$pack/models/trusted-publishers.model.json" <<'MODEL'
          {"extensions": [{"addsTo": {"pack": "codeql/actions-all", "extensible": "trustedActionsOwnerDataModel"}, "data": [["dazzer-io"]]}]}
          MODEL

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      # upload: never keeps the token read-only; the post-processed results are what an upload
      # would send. The database is not uploaded either, since that also needs security-events: write.
      # For actions, the queries read the trusted-publisher pack the second step wrote; for any
      # other language the option is empty, which the action reads as no options.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: ${{ matrix.language == 'actions' && '{"database":{"run-queries":["--model-packs=shared-scan/trusted-publishers@1.0.0"]}}' || '' }}
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif

      - name: Keep the results for the upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          # Seven days, so the upload can be re-run alone, after GitHub's automatic setup is
          # switched off on the calling repository, while the results are still here.
          retention-days: 7

  upload:
    name: Upload CodeQL results (${{ matrix.language }})
    needs: analyze
    # Only when every language's analysis succeeded: a partial scan never passes (decision 101). A
    # skipped upload reads as success to a required-check rule, so callers require complete's check.
    if: ${{ needs.analyze.result == 'success' }}
    # GitHub's own standard machine, by a literal label: this job holds a write token (decision 36).
    runs-on: ubuntu-latest
    # An upload waits for code scanning to process it, at most 155 s by the action's own backoff
    # (5, 15, 35, 75 and 155 s); the fetch and the post take seconds.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      # By name, so a language whose results are missing fails here rather than uploading nothing.
      - name: Fetch this language's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif

      - name: Upload the results under the language's category
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}

  # The one check a caller requires (decision 135): it fails unless every analysis and every upload
  # succeeded, whatever languages were named. It reads nothing but the two jobs' results, passed to
  # its script through env, and holds no token.
  complete:
    name: CodeQL complete
    needs: [analyze, upload]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unless every analysis and every upload succeeded
        env:
          ANALYZE: ${{ needs.analyze.result }}
          UPLOAD: ${{ needs.upload.result }}
        run: |
          if [ "$ANALYZE" = success ] && [ "$UPLOAD" = success ]; then
            echo "Every language was analysed and uploaded."
            exit 0
          fi
          echo "::error::The scan is not complete: analysis $ANALYZE, upload $UPLOAD."
          exit 1
