# Decide tests: runs this repository's own tests (node --test over test/) on every pull
# request and merge queue entry, so the decision logic of the shared workflows has CI.
#
# The repository ruleset requires a check named "decide-tests" from GitHub Actions; that
# check is this job's check run, so the job's name must stay exactly "decide-tests"
# (test/decide-tests-workflow.test.mjs holds it there). The tests read fixtures only:
# no network, no secrets, read-only token.
name: Decide tests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  decide-tests:
    name: decide-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run the tests
        run: node --test test/
