# Engineer review caller: each gated repository keeps a copy of this file as
# .github/workflows/engineer-review.yml (engineer-review/README.md, "Adopting it").
# The copy is made with
#   node engineer-review/decide.mjs caller --owner <organisation> --repo <shared workflow repository> --commit <40-character commit id>
# which fills the one "uses:" line below, refuses a branch or tag in place of a commit,
# and refuses a commit that is not on the shared workflow repository's main branch.
# The calling job holds uses and permissions alone, the shape the organisation's machine rule
# admits in a call (machine-rule/README.md, "Calls"): its own permissions are what it hands the
# called workflow, and the top grants reading the code alone. It needs no if: of its own: the
# called workflow's job skips a comment on an issue that is not a pull request, reading this
# run's event. A repository machine-rule/strict.json names (dazzer-app) takes no call asking a
# grant but codeql.yml's job codeql, so the rule refuses this caller there (decision 184).
name: Engineer review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  engineer-review:
    uses: <owner>/<repo>/.github/workflows/engineer-review.yml@<commit>
    permissions:
      statuses: write
      pull-requests: read
