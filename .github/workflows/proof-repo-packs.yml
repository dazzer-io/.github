# Throwaway live proof for r-3.30 (decision 168). Lives only on proof/ branches of
# dazzer-io/.github, never on main; the branches are deleted once read.
# It runs that branch's shared CodeQL scan over the actions language, beside two jobs that never
# run and exist only to be scanned: one uses an outside action at a tag, one calls the
# organisation's shared scan at main, the shape every repository's caller has.
name: Proof trusted publishers

on:
  push:
    branches: ['proof/**']
  # The green run also runs on a draft pull request from the proof branch, closed unmerged, so
  # the action's diff-informed analysis of a pull request is exercised with the change.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: '["actions"]'

  outside-at-a-tag:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3

  ours-at-main:
    if: false
    uses: dazzer-io/.github/.github/workflows/codeql.yml@main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: '["actions"]'
# The branch also carries .github/codeql/extensions/proof-pack, a model pack the scanned code brings
# itself, adding docker to CodeQL's trusted publishers. If the scan uses it, outside-at-a-tag raises
# no unpinned-tag result.
