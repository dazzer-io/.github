# Engineer review (D83, D86): sets the commit status "Engineer review" on a pull
# request's head commit, pending until a person who may merge has recorded a review
# of that commit, then success with who, when and the commit (engineer-review/README.md).
#
# Reusable: each gated repository calls it from its copy of engineer-review/caller.yml,
# and the organisation ruleset requires the status. Its own pull_request, issue_comment
# and pull_request_review triggers serve this repository, which needs no caller.
# A missing review is a pending status, never a failed job; a run whose token cannot
# write statuses (a fork's or Dependabot's) skips the write with a notice. The repository
# and organisation come from the run's own context, never from this file.
name: Engineer review

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  statuses: write
  pull-requests: read

jobs:
  engineer-review:
    # Named apart from the status it sets, so the ruleset's required "Engineer review"
    # can only be the status (pinned to GitHub Actions), never this job's check run.
    name: Settle engineer review
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One run at a time per pull request, so a slower run cannot overwrite a newer answer;
    # each run reads the pull request afresh, so a superseded waiting run loses nothing.
    concurrency:
      group: engineer-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Name this workflow's own repository and commit
        id: source
        env:
          SOURCE_REPO: ${{ job.workflow_repository }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$SOURCE_REPO" ]; then
            echo "::error title=Engineer review::the context job.workflow_repository is empty, so the decision script's source is unknown; nothing was set"
            exit 1
          fi
          if [ -z "$SOURCE_SHA" ]; then
            echo "::error title=Engineer review::the context job.workflow_sha is empty, so the decision script's commit is unknown; nothing was set"
            exit 1
          fi
          echo "repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch the decision script at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ github.token }}
          path: .engineer-review
          sparse-checkout: engineer-review
          persist-credentials: false

      - name: Settle the review and set the status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .engineer-review/engineer-review/decide.mjs
