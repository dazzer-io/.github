# The machine rule's building block: the steps .github/workflows/machine-rule.yml runs, kept here so
# GitHub fetches them itself, as dazzer-io/.github/machine-rule@main, the ref the organisation rule
# already runs that workflow from. GitHub fetches the whole repository at that ref,
# so judge.mjs, its lists, the YAML reader's package files and zizmor.yml stand beside this file at
# $GITHUB_ACTION_PATH, and the rule runs with no checkout of its own folder: a checkout with the
# caller's token cannot read a private repository, and GitHub's own fetch can, once the home shares
# its actions with the organisation and the calling job keeps contents: read (machine-rule/README.md).
#
# It judges the change's .github/workflows folder by judge.mjs, then lints the same folder with a
# pinned actionlint and zizmor, each checked by its SHA-256. Every value a step reads from GitHub is
# handed in by env, never written inside a run: line. machine-rule.yml's own header says why each
# lint flag and ignore is there.
name: Machine rule
description: Judges a change's workflows by the organisation's one machine rule, then lints them with actionlint and zizmor.
inputs:
  change:
    description: The folder holding the change, checked out at the pull request's or the merge group's head commit.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install the rule's YAML reader
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/.."
        npm ci --ignore-scripts

    - name: Judge the change's workflows
      shell: bash
      env:
        CHANGE: ${{ inputs.change }}
        REPOSITORY: ${{ github.repository }}
        VISIBILITY: ${{ github.event.repository.visibility }}
        GH_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/judge.mjs" --repository "$REPOSITORY" --visibility "$VISIBILITY" "$CHANGE"

    - name: Lint the change's workflows with actionlint and zizmor
      shell: bash
      env:
        CHANGE: ${{ inputs.change }}
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        ZIZMOR_VERSION: 1.31.1
        ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
      run: |
        if [ -z "$(find "$CHANGE/.github/workflows" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null)" ]; then
          echo "Machine rule: no workflow in .github/workflows, so actionlint and zizmor have nothing to read (never read as clean)"
          exit 0
        fi
        archive="$RUNNER_TEMP/actionlint.tar.gz"
        curl -fsSL --retry 5 --retry-all-errors -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
        cd "$CHANGE"
        "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -ignore 'property "workflow_(repository|sha)" is not defined in object type' -ignore '^label "dazzer-(checks|checks-regular|locked|scan)-[1-9][0-9]*-core" is unknown\. available labels are'
        archive="$RUNNER_TEMP/zizmor.tar.gz"
        curl -fsSL --retry 5 --retry-all-errors -o "$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
        echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP" zizmor
        "$RUNNER_TEMP/zizmor" --offline --no-progress --no-exit-codes --no-ignores --collect=all --strict-collection --config "$GITHUB_ACTION_PATH/zizmor.yml" --format json .github > "$RUNNER_TEMP/zizmor.json"
        jq -r '.[] | select(.ident == "unpinned-uses") | .locations[0] | "::error file=\(.symbolic.key.Local.verbatim_path | ltrimstr("./")),line=\(.concrete.location.start_point.row + 1),title=Machine rule::an action used by tag or branch: pin it by its commit, its version in a comment"' "$RUNNER_TEMP/zizmor.json" | tee "$RUNNER_TEMP/unpinned"
        echo "Machine rule: zizmor read $(jq length "$RUNNER_TEMP/zizmor.json") finding(s) and refuses only an action not pinned by commit"
        [ ! -s "$RUNNER_TEMP/unpinned" ]
