# Machine rule: judges a change's .github/workflows folder by the organisation's
# one rule on which job may use which of our machines, machine-rule/judge.mjs, then lints the same
# folder with linters. The organisation ruleset machine-rule-required (machine-rule/ruleset.json)
# runs this file on the default branch of every repository; here it also runs on this repository's
# own pull requests and merge queue entries.
#
# The change is checked out of the triggering repository at the pull request's head commit or the
# merge group's, keeping no git credential. The rule itself is never checked out: its steps are the
# building block machine-rule/action.yml, which GitHub fetches itself as
# dazzer-io/.github/machine-rule@main, the ref the organisation rule already runs this file from,
# so the rule still runs once its home is private, where a checkout with the caller's token could
# not read it. judge.mjs admits that call from dazzer-io/.github and from
# dazzer-io/checks, the home's name after the move. The job keeps contents: read: a live trial read
# a private repository's workflow granted nothing failing to fetch its own repository's action.
#
# It runs on GitHub's ubuntu-latest, written as a literal label, a job of under a minute: reading
# no setting keeps it off our machines in public repositories, where the fallback watcher does not
# read the runs; kept.json names it. Its token reads the code alone, and it holds no
# secret. In the building block, actionlint is a pinned release, checked by its SHA-256 before it
# runs, with shellcheck and pyflakes off. Its two ignores are narrow. actionlint 1.7.12's job
# context lacks workflow_repository and workflow_sha, which GitHub's job context gives and this
# repository's engineer-review.yml and security-scan.yml read, so without the first this
# repository's own folder is never clean. actionlint knows GitHub's labels alone, so it calls each
# of our own sets unknown, while the judge alone rules where our names may stand. So the second
# drops actionlint's unknown-label error for exactly a name judge.mjs's OUR_MACHINE matches, and any
# other label actionlint does not know is still reported.
# zizmor is pinned and checked the same way, reads .github offline, honouring no ignore comment, by
# machine-rule/zizmor.yml: it refuses only an action not pinned by commit (the organisation's own
# workflows and this building block may be called on a branch), and counts every other finding
# without refusing it.
# The workflow's own token grants nothing; the one job reads the code alone.
name: Machine rule

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  machine-rule:
    name: Machine rule
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Name the change's head commit
        id: change
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "::error title=Machine rule::neither the pull request's nor the merge group's head commit is set, so the change to judge is unknown"
            exit 1
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch the change at its head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.change.outputs.sha }}
          path: .change
          persist-credentials: false

      - name: Judge and lint the change's workflows
        uses: dazzer-io/.github/machine-rule@main
        with:
          change: .change
